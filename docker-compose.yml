name: hashreviewer
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["8080:8080"]
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  api:
    profiles: [reputation]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HASHSENTRY_VIRUS_TOTAL_API_KEY: ${HASHSENTRY_VIRUS_TOTAL_API_KEY:-}
      HASHSENTRY_REPUTATION_REQUESTS_PER_MINUTE: ${HASHSENTRY_REPUTATION_REQUESTS_PER_MINUTE:-4}
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
